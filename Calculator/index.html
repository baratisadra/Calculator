<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <header class="heading">
        <span class="status-dot" aria-hidden="true"></span>
        <h1>Calculator</h1>
      </header>

      <section class="calculator" aria-label="Basic calculator">
        <div class="screen">
          <input id="display" type="text" value="0" readonly aria-label="Calculation" />
        </div>

        <div class="keys">
          <button type="button" class="utility" data-action="clear" aria-label="Clear all">AC</button>
          <button type="button" class="utility" data-action="delete" aria-label="Delete last character">DEL</button>
          <button type="button" class="operator" data-value="/" aria-label="Divide">÷</button>
          <button type="button" class="operator" data-value="*" aria-label="Multiply">×</button>

          <button type="button" data-value="7">7</button>
          <button type="button" data-value="8">8</button>
          <button type="button" data-value="9">9</button>
          <button type="button" class="operator" data-value="-" aria-label="Subtract">−</button>

          <button type="button" data-value="4">4</button>
          <button type="button" data-value="5">5</button>
          <button type="button" data-value="6">6</button>
          <button type="button" class="operator" data-value="+" aria-label="Add">+</button>

          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" class="equals" data-action="calculate" aria-label="Equals">=</button>

          <button type="button" class="zero" data-value="0">0</button>
          <button type="button" data-value=".">.</button>
        </div>
      </section>
    </main>

    <script>
      const display = document.getElementById("display");
      let expression = "";
      let calculated = false;

      // Update the display using familiar multiplication and division symbols.
      function updateDisplay() {
        display.value = expression.replaceAll("*", "×").replaceAll("/", "÷") || "0";
        display.scrollLeft = display.scrollWidth;
      }

      // Add a number or operator to the current calculation.
      function appendValue(value) {
        if (expression === "Error" || (calculated && /[0-9.]/.test(value))) {
          expression = "";
        }
        calculated = false;

        if (/[+*/-]/.test(value)) {
          if (!expression && value !== "-") return;
          if (/[+*/-]$/.test(expression)) {
            expression = expression.slice(0, -1);
          }
        }

        if (value === ".") {
          const currentNumber = expression.split(/[+*/-]/).pop();
          if (currentNumber.includes(".")) return;
          if (!currentNumber) expression += "0";
        }

        const lastNumber = expression.split(/[+*/-]/).pop();
        if (/^[0-9]$/.test(value) && lastNumber === "0") {
          expression = expression.slice(0, -1);
        }
        expression += value;
        updateDisplay();
      }

      // Clear the complete calculation.
      function clearDisplay() {
        expression = "";
        calculated = false;
        updateDisplay();
      }

      // Remove only the last character, leaving the rest of the calculation.
      function deleteLast() {
        expression = expression === "Error" ? "" : expression.slice(0, -1);
        calculated = false;
        updateDisplay();
      }

      // Evaluate only numeric arithmetic and show invalid calculations as errors.
      function calculate() {
        if (!expression || expression === "Error") return;
        try {
          if (!/^[0-9e+*/.\-]+$/.test(expression)) throw new Error("Invalid input");
          const result = Function('"use strict"; return (' + expression + ')')();
          if (!Number.isFinite(result)) throw new Error("Invalid result");
          expression = String(Number(result.toPrecision(12)));
          calculated = true;
        } catch {
          expression = "Error";
          calculated = false;
        }
        updateDisplay();
      }

      document.querySelector(".keys").addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) return;
        if (button.dataset.action === "clear") clearDisplay();
        else if (button.dataset.action === "delete") deleteLast();
        else if (button.dataset.action === "calculate") calculate();
        else appendValue(button.dataset.value);
      });

      document.addEventListener("keydown", (event) => {
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (/^[0-9.+*/-]$/.test(event.key)) appendValue(event.key);
        else if (event.key === "Enter" || event.key === "=") calculate();
        else if (event.key === "Backspace" || event.key === "Delete") deleteLast();
        else if (event.key === "Escape") clearDisplay();
        else return;
        event.preventDefault();
      });
    </script>
  </body>
</html>
